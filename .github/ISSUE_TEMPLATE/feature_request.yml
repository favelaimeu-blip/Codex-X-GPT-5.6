name: Feature request
description: Propose a focused improvement to Codex-X GPT-5.6.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues for a similar request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user problem or workflow limitation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Include workarounds or alternative designs you considered.
